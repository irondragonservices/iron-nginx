name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

jobs:
  ci:
    uses: irondragonservices/.github/.github/workflows/image-release.yml@3ab64c35ed5d357c0b1285e23060035440a8d8e6 # main
    with:
      version-from: nginx
